<style>
:root{
  --night:#0A0F1D;--cobalt:#315BD6;--blue-light:#5F82DE;--ice:#AFC6FF;--white:#F5F7FC;--mint:#66D9B2;

*{box-sizing:border-box;margin:0}

}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

main{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.path{
  display:flex;flex-direction:column;align-items:center;text-decoration:none;
  -webkit-tap-highlight-color:transparent;border-radius:28px;--logo:clamp(120px,34vw,172px);
}
.path:focus-visible{outline:3px solid var(--mint);outline-offset:10px}

/* YamYam mark */
.mark{position:relative;width:var(--logo);height:var(--logo)}
.mark svg{
  display:block;width:100%;height:100%;border-radius:23%;
  box-shadow:0 22px 60px -14px rgba(49,91,214,.9),0 0 0 1px rgba(175,198,255,.16) inset;
  animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
}
.mark::after{ /* light that leaves the logo at the start of every pulse */
  content:"";position:absolute;inset:-18%;border-radius:50%;z-index:-1;
  background:radial-gradient(closest-side,rgba(95,130,222,.55),transparent);
  opacity:0;animation:emit var(--cycle) ease-out var(--start) infinite;
}

/* The braid: two strands leave the two Y stems, twist and merge into the badge */
.braid{display:block;position:relative;width:calc(var(--logo) * 1.28);height:auto;margin-top:calc(var(--logo) * -.18);overflow:visible}
.strand{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1.3s cubic-bezier(.6,0,.2,1) .45s forwards}
.halo{fill:none;stroke-width:9;stroke-linecap:round;opacity:.22;filter:url(#soft);stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1.3s cubic-bezier(.6,0,.2,1) .45s forwards}
.pulse{fill:none;stroke-width:4.6;stroke-linecap:round;stroke:#fff;filter:url(#glow);
  stroke-dasharray:.16 1.4;stroke-dashoffset:.16;animation:travel var(--cycle) cubic-bezier(.45,0,.55,1) var(--start) infinite}
.pulse.b{animation-delay:calc(var(--start) + .12s)}
.knot{opacity:0;animation:knot var(--cycle) ease-out var(--start) infinite}
.foot{opacity:0;animation:fade .4s ease .7s forwards,foot var(--cycle) ease-out var(--start) infinite}

/* Google Play badge */
.badge{position:relative;margin-top:-6px;animation:rise .7s cubic-bezier(.2,1.2,.4,1) 1.55s both}
.badge img{display:block;width:clamp(220px,62vw,280px);height:auto;position:relative;transition:transform .25s ease}
.badge::before{ /* lights up when the pulse arrives */
  content:"";position:absolute;inset:-14px -18px;border-radius:26px;
  background:radial-gradient(closest-side,rgba(102,217,178,.55),rgba(49,91,214,.25) 60%,transparent);
  filter:blur(10px);opacity:.25;animation:arrive var(--cycle) ease-out var(--start) infinite;
}
.path:hover .badge img,.path:focus-visible .badge img{transform:translateY(-3px) scale(1.03)}
.path:active .badge img{transform:scale(.97)}

@keyframes pop{from{opacity:.3;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes foot{0%{opacity:.8;r:3.4}8%{opacity:1;r:5.5}30%,100%{opacity:.8;r:3.4}}
@keyframes rise{from{opacity:.3;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes travel{0%{stroke-dashoffset:.16}62%,100%{stroke-dashoffset:-1.05}}
@keyframes emit{0%{opacity:0;transform:scale(.8)}10%{opacity:1}40%,100%{opacity:0;transform:scale(1.15)}}
@keyframes arrive{0%,48%{opacity:.25;transform:scale(1)}60%{opacity:1;transform:scale(1.06)}100%{opacity:.25;transform:scale(1)}}
@keyframes knot{0%,46%{opacity:0;r:0}56%{opacity:1;r:5}80%,100%{opacity:0;r:14}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .strand,.halo{stroke-dashoffset:0}
  .pulse,.knot,.sparks{display:none}
  .foot{opacity:.8}
}
</style>
